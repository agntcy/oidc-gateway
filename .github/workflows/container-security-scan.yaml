name: Container Security Scan

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *" # Daily at 03:00 UTC

permissions:
  contents: read
  security-events: write
  actions: read
  issues: write

jobs:
  image-list:
    name: Resolve image list
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0

      - name: Get image list from task
        id: matrix
        env:
          IMAGE_TAG: latest
          IMAGE_REPO: ghcr.io/${{ github.repository_owner }}
        run: |
          matrix=$(task --silent deps:vuln:images:list | jq -R -s -c 'split("\n") | map(select(length > 0)) | {image: .}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  trivy-scan:
    name: Trivy Scan
    runs-on: ubuntu-latest
    needs: [image-list]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.image-list.outputs.matrix) }}
    steps:
      - name: Set image name
        id: image-name
        run: |
          IMAGE_NAME=$(echo "${{ matrix.image }}" | sed -E 's|.*/||; s|[:@].*||')
          echo "name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"

      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # trivy-action v0.36.0 defaults to Trivy v0.70.0; pin the current release instead.
          version: v0.76.2
          image-ref: ${{ matrix.image }}
          github-pat: ${{ secrets.GITHUB_TOKEN }}
          format: sarif
          output: trivy-${{ steps.image-name.outputs.name }}.sarif
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH,MEDIUM"
          ignore-unfixed: true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: trivy-${{ steps.image-name.outputs.name }}.sarif
          category: trivy-${{ steps.image-name.outputs.name }}

      - name: Upload report artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-report-${{ steps.image-name.outputs.name }}
          path: trivy-${{ steps.image-name.outputs.name }}.sarif
          retention-days: 7
